<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Случайная цитата</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        .quote-container {
            background-color: #f9f9f9;
            border-left: 5px solid #4CAF50;
            padding: 20px;
            margin: 20px 0;
        }
        .quote {
            font-size: 1.5em;
            margin-bottom: 10px;
            font-style: italic;
        }
        .author {
            font-weight: bold;
            color: #555;
        }
        .source {
            font-size: 0.8em;
            color: #888;
            margin-top: 10px;
        }
        .refresh-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }
        .refresh-btn:hover {
            background-color: #45a049;
        }
        .error {
            color: #d32f2f;
        }
    </style>
</head>
<body>
    <h1>Случайная цитата</h1>

    <div class="quote-container">
        <div class="quote">{{ quote.content }}</div>
        <div class="author">— {{ quote.author }}</div>
        {% if quote.source %}
        <div class="source">Источник: {{ quote.source }}</div>
        {% endif %}
    </div>

    <button class="refresh-btn" onclick="window.location.reload();">Новая цитата</button>

    {% if quote.source == 'Локальное сообщение' %}
    <div class="error">
        <p>Извините, мы не смогли подключиться к сервису цитат. Показано локальное сообщение.</p>
    </div>
    {% endif %}
</body>
</html>
